# Optional layer: puts gitleaks on the CI runner so the check job also runs the local key scan
# (and any test that plants a fake key stops skipping). Pinned like shellcheck; bump with the local install.
- name: install gitleaks 8.30.1
  run: |
    curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    mkdir "$RUNNER_TEMP/gitleaks"
    tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
    sudo install "$RUNNER_TEMP/gitleaks/gitleaks" /usr/local/bin/gitleaks
    gitleaks version
