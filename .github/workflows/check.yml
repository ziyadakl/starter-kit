# The one CI check: runs scripts/check.sh, the same command as the local pre-push hook.
# Pushes to main run it too, so the caches that pull requests restore stay filled.
name: check

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (cached)
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      # Pinned so local and CI agree; bump together with the local install.
      - name: install shellcheck 0.11.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          mkdir "$RUNNER_TEMP/sc"
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP/sc" --strip-components=1
          sudo install "$RUNNER_TEMP/sc/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # starter-kit: layer setup steps
      - name: Run the project check
        run: bash scripts/check.sh
      - name: Report cache hits and misses
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEPS" | jq -r '
            to_entries[]
            | select(.value.outputs["cache-hit"] != null)
            | "cache: \(.key) \(if .value.outputs["cache-hit"] == "true" then "hit" else "miss" end)"
          ' >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: No keys in the code (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # gitleaks comments on the pull request when it finds a key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
